# llama-swap: ローカルLLMエンドポイントのモデルレジストリ(chezmoi管理)
#
# モデル入れ替え手順:
#   1. このファイル(chezmoiソース)を編集
#   2. chezmoi apply ~/.config/llama-swap/config.yaml
#   3. launchctl kickstart -k gui/$UID/local.llama-swap  (設定再読込)
#   消費側 (Hermes / opencode / dsh / docs) はエントリ名で参照しているので、名前を変えなければ
#   触らずに済む。全体像は docs/local-llm-architecture.md。
#
# リクエストの model 名に応じて llama-swap が上流サーバーを自動起動・排他スワップする。
# バックエンドは 2026-09-05 から mlx-serve (ddalcu、Zig+Metal ネイティブ)。
#   実機 A/B (docs/mlxserve-ab-20260905.md、順序反転 2 周):
#     本命   Flash-Next 4bit      short 70.3 / 24k 後 57.9 tok/s、prefill 694  (llama.cpp UD-Q3_K_XL: 34.0 / 26.0 / 402)
#     無検閲 Flash-Next mixed4/8  short 56.1 / 24k 後 47.9 tok/s、prefill 700  (llama.cpp i1-IQ4_XS:   37.7 / 33.3 / 398)
#   品質プローブ (code 5 題 / tools 4 問 / NIAH / 日本語 / 拒否 3 問) は llama.cpp と同等。
#   短文 TTFT は 0.4 秒ほど悪化 (0.8 → 1.2 s)。
#   thinking は mlx-serve のサーバ既定が off で、既定を変えるフラグが無い (--reasoning-budget は上限のみ)。
#   llama.cpp 時代と同じ「常に thinking on」にするため、llama-swap の filters.setParams で
#   全リクエストに enable_thinking: true を注入している (2026-09-05)。クライアント側の
#   enable_thinking: false は上書きされる。一時的に切りたいときは setParams をコメントアウトして kickstart。
#
# ⚠️ メモリ: mlx-serve は重み 67〜70GB を wired (退避不可) で持ち、推論中はシステムの wired が
#    78〜90GB に達する (Metal wired limit は起動時に 110,100MB へ引き上げられる)。上限を超えると
#    Metal OOM でプロセスが即死するので、必ず llama-swap の排他スワップの中で動かすこと。
#    手動で mlx-serve を単独起動しているときに llama-swap 側でモデルを立てない (2026-09-05 に実際に落ちた)。
#
# llama.cpp (GGUF) 経路は 2026-09-05 に撤去。バイナリ (~/.local/opt/llama.cpp、b10769) は戻し用に残置、
# GGUF は削除済み。戻す場合の cmd は jj 履歴 (2026-09-05 以前の本ファイル) を参照。

# 初回ロードは mlx-serve が 16〜18 秒でヘルス到達 (遅延ロード)。HF 取得を伴う場合の保険として長めに取る。
healthCheckTimeout: 1800

macros:
  # run_onchange_after_install-mlx-serve.sh が MLX_SERVE_VERSION を固定して配置する。
  mlx_serve: /Users/joe/.local/opt/mlx-serve/current/mlx-serve-macos-arm64/mlx-serve
  # 戻し用 (現在は未使用)。run_onchange_after_install-llama-cpp.sh の LLAMA_CPP_BUILD で固定。
  llama_server: /Users/joe/.local/opt/llama.cpp/current/llama-server

models:
  # ── コーディング主力 + 日本語チャット兼用 (本命) ─────────────────
  # Qwen3.8-Flash-Next: 125B MoE (512エキスパート top-10) + 51B n-gram 埋め込み表 /
  # アクティブ 6B/token / ネイティブマルチモーダル / 262K native / QSA スパースアテンション。
  # 2026-08-30 に本命を Qwen3.8-27B から移行 (docs/llmweekly20260827.md)。
  # 27B 比: DeepSWE 1.1 58.7 vs 42.2 / SWE-bench Multilingual 81.0 vs 77.5。
  # ただし Terminal-Bench 2.1 は 27B 側が優位。ライセンスは Qwen Community License 1.0。
  #
  # パック: ddalcu/Qwen3.8-Flash-Next-MLX-Serve-4bit (105GB、113 ファイル)
  #   routed experts / attention / GDN / embed 4bit g64、lm_head 8bit g64、n-gram 表 4bit g32。
  #   n-gram 表は ngram_table.bin (32GB) として mmap され GPU に乗らない (page cache)。
  #   MTP ヘッドと vision タワーを同梱。常駐 ≈ 67GB (wired) + KV。
  #   取得: mlx-serve pull ddalcu/Qwen3.8-Flash-Next-MLX-Serve-4bit
  #   ⚠️ pull は既存ディレクトリの欠落シャードを検出しない。手動取得したら HF API の
  #      siblings サイズと全ファイルを照合すること。
  #
  # フラグ:
  #   --ctx-size 262144  ネイティブ上限。KV は数 GB。
  #   --mtp は付けない: 本命パックでは短文 +6%、24k 後 −2〜−14% (受理率 40〜51%) で利得なし。
  #   --kv-quant は既定 off (f16 相当)。
  #   thinking は filters.setParams で常時 on (ファイル冒頭の注記参照)。
  #
  # mlx-serve の /v1/models はディレクトリ名 (org/ なし) を id にするので useModelName で読み替える。
  qwen38-flash-next:
    cmd: |
      ${mlx_serve}
      --model /Users/joe/.mlx-serve/models/ddalcu/Qwen3.8-Flash-Next-MLX-Serve-4bit
      --serve --host 127.0.0.1 --port ${PORT}
      --ctx-size 262144
    useModelName: Qwen3.8-Flash-Next-MLX-Serve-4bit
    checkEndpoint: /health
    filters:
      setParams:
        enable_thinking: true
    ttl: 7200
    aliases:
      - flash-next
      - default

  # ── 無検閲: 拒否ゼロ系 (abliterated) — Hermes 既定 ─────────────────
  # ARC4NUM/Qwen3.8-Flash-Next-Uncensored-MLX-Serve-4bit (107GB、113 ファイル、非 gated、Apache-2.0 表記)。
  #   base_model: orcarouter/Qwen3.8-Flash-Next-Uncensored (BF16 で abliteration、系譜は旧 27B 無検閲枠と同じ)。
  #   量子化は mixed 4/8bit: routed experts 4bit g64、attention / GDN / shared expert / lm_head 8bit g64、
  #   n-gram 表 4bit g32。非 expert 部が 8bit なので本命より decode が遅い (56 vs 70 tok/s) が品質側に厚い。
  #   常駐 ≈ 70GB (wired)。
  #   取得: mlx-serve pull ARC4NUM/Qwen3.8-Flash-Next-Uncensored-MLX-Serve-4bit
  #
  # 2026-09-05 実測 (llama.cpp mradermacher i1-IQ4_XS 比): decode 1.49 倍 / 24k 後 1.44 倍 / prefill 1.76 倍。
  #   拒否プローブ 3 問 (フィッシング教材 / 小説の悪役独白 / 過量服薬情報) は両エンジンとも回答 →
  #   量子化で abliteration は失われていない。tools 4/4、code 5/5。
  #   --mtp はこのパックでは +8〜13% (短文) / +4% (24k 後) と小さく正だが、本命と揃えて off。
  # ⚠️ Flash-Next は MoE。MoE への abliteration は dense より品質劣化リスクが高い
  #    (Qwen3-30B-A3B の abliterated が非 abliterated 4-8B に負けた報告あり)。
  #
  # 旧 GGUF (mradermacher i1-IQ4_XS 97.5GB、37.7 tok/s) は 2026-09-05 に削除。
  # 比較枠 RVN (0bserverx) と旧 27B 無検閲枠は同日撤去。
  qwen38-flash-next-uncensored:
    cmd: |
      ${mlx_serve}
      --model /Users/joe/.mlx-serve/models/ARC4NUM/Qwen3.8-Flash-Next-Uncensored-MLX-Serve-4bit
      --serve --host 127.0.0.1 --port ${PORT}
      --ctx-size 262144
    useModelName: Qwen3.8-Flash-Next-Uncensored-MLX-Serve-4bit
    checkEndpoint: /health
    filters:
      setParams:
        enable_thinking: true
    ttl: 7200
    aliases:
      - abliterated
