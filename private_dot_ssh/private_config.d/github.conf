# GitHub の push/fetch 認証。
# 1Password Agent は鍵を使うたびに承認ダイアログを出し、非対話で動く Agent の
# 作業を止めるため、IdentityAgent none で Agent を一切参照させず、
# ディスク上の専用鍵 (run_onchange_after_gen-git-keys.sh が生成) を直接使う。
# 各鍵は GitHub の該当アカウントに Authentication key として登録が必要。

# 会社用（デフォルト）
Host github.com
	HostName github.com
	User git
	IdentityFile ~/.ssh/git-auth-work
	IdentitiesOnly yes
	IdentityAgent none

# プライベート用
Host github-personal
	HostName github.com
	User git
	IdentityFile ~/.ssh/git-auth-personal
	IdentitiesOnly yes
	IdentityAgent none
