# Hermes Agent (Nous Research) — chezmoi管理
# ローカルのllama-swapエンドポイントに接続する。モデルは llama-swap 側の
# エイリアス名 (~/.config/llama-swap/config.yaml) を指定。
# context_length はエンドポイント自動検出(llama-swapは /v1/models/<id> 未実装で404)
# の代わりに明示指定する。llama-swap側の -c と揃えること。
# 注: hermes 自身がこのファイルにキーを追記することがある(_config_version等)。
# ドリフトしたら chezmoi diff で確認し、有用なら source に取り込むこと。
model:
  provider: custom
  base_url: http://127.0.0.1:8080/v1
  api_key: local
  # 2026-08-30: 無検閲枠を Qwen3.8-27B-Uncensored から Flash-Next 版へ移行。
  # 2026-09-03: 同エイリアスの実体を i1-IQ3_M → i1-IQ4_XS に更新 (名前は不変)。
  # 2026-09-05: 同エイリアスの実体を mlx-serve の ARC4NUM mixed 4/8bit パックに切り替え (名前は不変)。
  #   decode 56 tok/s (llama.cpp IQ4_XS の 1.5 倍)、拒否プローブ・tool_calls は同等。docs/mlxserve-ab-20260905.md。
  #   上流は構造化 tool_calls を返す必要がある — Hermes は content 内の XML <tool_call> を
  #   strip_think_blocks() で捨てるだけで実行しない。mlx-serve は Qwen の XML を tool_calls に変換する (確認済み)。
  #   mlx-serve は thinking がサーバ既定 off だが、llama-swap の filters.setParams で enable_thinking: true を
  #   注入して常時 on にしている (llama.cpp 時代と同じ)。
  default: qwen38-flash-next-uncensored
  context_length: 262144
  # mlx-serve --ctx-size 262144 と揃えている。
  # プロンプト分を残して出力上限は ctx の半分に留める。
  max_tokens: 131072
# hermes が書き込むマイグレーション marker。手で書き換えないこと。
# hermes 更新でこの値が上がったら chezmoi diff → source に取り込む。
_config_version: 33
plugins:
  # Discord ゲートウェイ (bundled plugin)。`hermes plugins enable discord-platform`
  # 相当。トークン等は ~/.hermes/.env (private_dot_env.tmpl) で設定する。
  enabled:
    - platforms/discord
    # 2026-09-03 追加 (全部無料・APIキー不要):
    # - disk-cleanup: セッション中に作った test_*/tmp_* を hook で自動掃除 (bundled)。
    #   `/disk-cleanup status|dry-run|quick` で手動操作も可。
    # - security-guidance: write_file/patch の内容に eval/pickle.load/shell=True 等
    #   25 パターンを検知して結果に警告を付ける (bundled、LLM トークン消費ゼロ)。
    #   ローカル LLM のコード生成の安全網。SECURITY_GUIDANCE_BLOCK=1 で拒否に変えられる。
    # - rtk-rewrite: PyPI `rtk-hermes` の entry point 名。terminal ツールのコマンドを
    #   `rtk <cmd>` に書き換えて出力を 60-90% 圧縮する (ローカル推論は prefill が
    #   約160 tok/s なのでプロンプト短縮がそのまま待ち時間短縮になる)。
    #   rtk バイナリ (Brewfile `brew "rtk"`) が無いとプラグイン自体が登録をスキップする。
    #   pip 配布なので `hermes plugins enable` では認識されない場合があり、ここに直書き。
    #   pip 側は run_onchange_after_install-uv-tools.sh の --with で固定している。
    - disk-cleanup
    - security-guidance
    - rtk-rewrite
  # 注: web-ddgs (DuckDuckGo 検索、キー不要) は kind: backend の bundled plugin で
  # 自動ロードされる。有効化条件は `ddgs` パッケージが import できることだけ
  # (uv-tools スクリプトの --with 'ddgs')。キー付きプロバイダが無い環境では
  # tools/web_tools.py の自動選択で ddgs が search backend になる。
memory:
  # 外部メモリプロバイダ (単一選択)。holographic は bundled の SQLite+FTS5 事実ストアで
  # 依存なし・外部 API なし。built-in MEMORY.md (2,200 字上限) を超える長期記憶を
  # fact_store ツールで持つ。DB は ~/.hermes/memory_store.db。
  # hermes が `plugins.hermes-memory-store` 等を追記したら chezmoi diff で取り込む。
  provider: holographic
agent: {}
# hermes が対話中に書き込む「案内を見た」フラグ。取り込んで diff を消しているだけ。
onboarding:
  seen:
    busy_input_prompt: true
